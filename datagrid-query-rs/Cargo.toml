[package]
name = "datagrid_query"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Query builder for data grids"
license = "MIT"
keywords = ["datagrid", "query-builder", "sql"]
categories = ["database"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1"] }

[[test]]
name = "pglite_delete"
path = "tests/pglite-test/delete.rs"

[[test]]
name = "pglite_insert"
path = "tests/pglite-test/insert.rs"

[[test]]
name = "pglite_merge"
path = "tests/pglite-test/merge.rs"

[[test]]
name = "pglite_query"
path = "tests/pglite-test/query.rs"

[[test]]
name = "pglite_update"
path = "tests/pglite-test/update.rs"

[[test]]
name = "pglite_upsert"
path = "tests/pglite-test/upsert.rs"
